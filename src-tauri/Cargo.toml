[package]
name = "kk_novel_ai"
version = "0.2.16"
edition = "2021"
authors = ["kk"]

[[bin]]
name = "kk_novel_ai"
path = "src/main.rs"

[[bin]]
name = "kk_novel_cli"
path = "src/bin/kk_novel_cli.rs"

[lib]
name = "kk_novel_ai_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "=2.11.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
krilla = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
